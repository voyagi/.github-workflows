name: Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        default: "22"
      run-build:
        description: "Run build step (npm run build)"
        type: boolean
        default: false
      run-tests:
        description: "Run test suite (npm test)"
        type: boolean
        default: false
      run-biome:
        description: "Run Biome lint and format check"
        type: boolean
        default: true
      run-knip:
        description: "Run Knip dead code check"
        type: boolean
        default: false
      run-trivy:
        description: "Run Trivy dependency scan"
        type: boolean
        default: false
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
      DISCORD_WEBHOOK_URL:
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci

      - name: Biome check
        id: biome
        if: ${{ inputs.run-biome }}
        continue-on-error: true
        run: npx biome check .

      - name: Build
        id: build
        if: ${{ inputs.run-build }}
        continue-on-error: true
        run: npm run build

      - name: Test
        id: test
        if: ${{ inputs.run-tests }}
        continue-on-error: true
        run: npm test

      - name: Knip dead code check
        id: knip
        if: ${{ inputs.run-knip }}
        continue-on-error: true
        run: npx knip

      - name: Trivy security scan
        id: trivy
        if: ${{ inputs.run-trivy }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL

      - name: Notify on failure
        id: notify
        if: |
          (steps.biome.outcome == 'failure' || steps.build.outcome == 'failure' ||
           steps.test.outcome == 'failure' || steps.knip.outcome == 'failure' ||
           steps.trivy.outcome == 'failure')
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          FAILED=""
          [ "${{ steps.biome.outcome }}" = "failure" ] && FAILED="${FAILED}biome, "
          [ "${{ steps.build.outcome }}" = "failure" ] && FAILED="${FAILED}build, "
          [ "${{ steps.test.outcome }}" = "failure" ] && FAILED="${FAILED}test, "
          [ "${{ steps.knip.outcome }}" = "failure" ] && FAILED="${FAILED}knip, "
          [ "${{ steps.trivy.outcome }}" = "failure" ] && FAILED="${FAILED}trivy, "
          FAILED="${FAILED%, }"
          MSG="CI FAILED [${{ github.repository }}]: ${FAILED}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          SENT=false

          # Try Telegram first
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="${MSG}" \
              -d disable_web_page_preview=true)
            [ "$HTTP_CODE" = "200" ] && SENT=true
            [ "$SENT" = "false" ] && echo "::warning::Telegram failed (HTTP $HTTP_CODE)"
          fi

          # Discord fallback if Telegram failed or unconfigured
          if [ "$SENT" = "false" ] && [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"[Telegram down] ${MSG}\",\"username\":\"Watchtower\"}" || true
            echo "::notice::Sent via Discord (Telegram fallback)"
          fi

      - name: Fail if any step failed
        if: |
          steps.biome.outcome == 'failure' || steps.build.outcome == 'failure' ||
          steps.test.outcome == 'failure' || steps.knip.outcome == 'failure' ||
          steps.trivy.outcome == 'failure'
        run: |
          echo "::error::One or more CI steps failed"
          exit 1
