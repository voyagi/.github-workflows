name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version"
        type: string
        default: "3.12"
      requirements-file:
        description: "Main requirements file"
        type: string
        default: "requirements.txt"
      dev-requirements-file:
        description: "Dev requirements file (leave empty to skip)"
        type: string
        default: ""
      run-tests:
        description: "Run pytest"
        type: boolean
        default: false
      run-mypy:
        description: "Run mypy type checking"
        type: boolean
        default: false
      run-trivy:
        description: "Run Trivy dependency scan"
        type: boolean
        default: false

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r ${{ inputs.requirements-file }}
          pip install ruff

      - name: Install dev dependencies
        if: ${{ inputs.dev-requirements-file != '' }}
        run: pip install -r ${{ inputs.dev-requirements-file }}

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        if: ${{ inputs.run-mypy }}
        run: mypy .

      - name: Pytest
        if: ${{ inputs.run-tests }}
        run: pytest

      - name: Trivy security scan
        if: ${{ inputs.run-trivy }}
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
